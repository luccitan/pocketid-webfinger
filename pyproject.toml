[project]
    name = "pocketid-webfinger"
    version = "0.1.0"
    description = "FastAPI app acting as Webfinger endpoint with Pocket ID OIDC provider in mind"
    license = "MIT"
    readme = "README.md"
    requires-python = ">=3.14,<3.15"
    authors = [{ name = "Tanguy LUCCI", email = "<tanguylucci@protonmail.com"}]
    maintainers = [{ name = "Tanguy LUCCI", email = "<tanguylucci@protonmail.com"}]
    keywords = [
        "fastapi",
        "pocketid",
        "oidc",
        "webfinger",
    ]

    dependencies = [
        "fastapi~=0.129.0",
        "uvicorn~=0.41.0",
    ]

    [project.urls]
        homepage = "https://github.com/luccitan/pocketid-webfinger"
        repository = "https://github.com/luccitan/pocketid-webfinger"
        documentation = "https://github.com/luccitan/pocketid-webfinger"

[dependency-groups]
    dev = [
        "httpx~=0.28.1",
        "pytest~=9.0.2",
        "ruff~=0.15.1",
    ]

[tool.ruff]
    line-length = 120
    indent-width = 4
    target-version = "py314"

    [tool.ruff.lint]
        # Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
        # Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
        # McCabe complexity (`C901`) by default.
        select = ["E4", "E7", "E9", "F"]
        ignore = []

        # Allow fix for all enabled rules (when `--fix`) is provided.
        fixable = ["ALL"]
        unfixable = []

        # Allow unused variables when underscore-prefixed.
        dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

    [tool.ruff.format]
        quote-style = "double"
        indent-style = "space"

        # Like Black, respect magic trailing commas.
        skip-magic-trailing-comma = false

        # Like Black, automatically detect the appropriate line ending.
        line-ending = "auto"

        # Enable auto-formatting of code examples in docstrings. Markdown,
        # reStructuredText code/literal blocks and doctests are all supported.
        #
        # This is currently disabled by default, but it is planned for this
        # to be opt-out in the future.
        docstring-code-format = false

        # Set the line length limit used when formatting code snippets in
        # docstrings.
        #
        # This only has an effect when the `docstring-code-format` setting is
        # enabled.
        docstring-code-line-length = "dynamic"
